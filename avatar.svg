<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#161F30"/>
    </linearGradient>
    <linearGradient id="pastelAccent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="pastelAccent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#818CF8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#bgPastel)"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#pastelAccent1)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="120" cy="110" r="70" fill="#C4B5FD" opacity="0.1" filter="blur(30px)"/>
  <circle cx="290" cy="280" r="80" fill="#6EE7B7" opacity="0.1" filter="blur(30px)"/>

  <!-- Character Silhouette -->
  <!-- Shoulders / Torso / Hoodie -->
  <path d="M 110 370 C 110 300, 150 270, 200 270 C 250 270, 290 300, 290 370 Z" fill="#334155"/>
  <path d="M 145 370 L 160 295 L 200 325 L 240 295 L 255 370 Z" fill="#1E293B"/>
  
  <!-- Collar / Inner Shirt -->
  <path d="M 175 270 L 200 305 L 225 270 Z" fill="#6EE7B7" opacity="0.8"/>

  <!-- Neck -->
  <rect x="186" y="225" width="28" height="50" rx="10" fill="#FBBF24"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="185" rx="52" ry="60" fill="#FDE68A"/>

  <!-- Modern Hair Style -->
  <path d="M 148 180 C 145 130, 175 110, 205 110 C 240 110, 255 135, 253 175 C 248 150, 235 140, 215 140 C 190 140, 170 148, 152 170 Z" fill="#1E293B"/>

  <!-- Glasses (Stylish Dev look) -->
  <rect x="160" y="165" width="32" height="24" rx="7" fill="none" stroke="#60A5FA" stroke-width="3.5"/>
  <rect x="208" y="165" width="32" height="24" rx="7" fill="none" stroke="#60A5FA" stroke-width="3.5"/>
  <line x1="192" y1="177" x2="208" y2="177" stroke="#60A5FA" stroke-width="3"/>
  <circle cx="176" cy="177" r="4" fill="#1E293B"/>
  <circle cx="224" cy="177" r="4" fill="#1E293B"/>
  <circle cx="178" cy="175" r="1.5" fill="#FFFFFF"/>
  <circle cx="226" cy="175" r="1.5" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 188 215 Q 200 226 212 215" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>

  <!-- Laptop in front -->
  <path d="M 125 350 L 275 350 L 295 385 L 105 385 Z" fill="#0F172A" filter="url(#cardShadow)"/>
  <rect x="135" y="300" width="130" height="78" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <rect x="141" y="306" width="118" height="64" rx="4" fill="#090D16"/>
  
  <!-- Code on Screen -->
  <text x="150" y="322" font-family="monospace" font-size="9" fill="#6EE7B7">&gt; def build():</text>
  <text x="160" y="335" font-family="monospace" font-size="8" fill="#93C5FD">return "Sagar"</text>
  <text x="150" y="348" font-family="monospace" font-size="8" fill="#FCA5A5">&gt; learn_code()</text>
  <text x="150" y="361" font-family="monospace" font-size="8" fill="#FDE68A">&gt; MCA @ PIM</text>

  <!-- Laptop Logo / Apple / Dev style -->
  <circle cx="200" cy="382" r="3" fill="#6EE7B7"/>

  <!-- Floating Tech Badges -->
  <!-- Python -->
  <g transform="translate(45, 120)">
    <rect width="68" height="28" rx="14" fill="#1E293B" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="34" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">🐍 Python</text>
  </g>

  <!-- SQL / MySQL -->
  <g transform="translate(285, 110)">
    <rect width="65" height="28" rx="14" fill="#1E293B" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="32" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">🗄️ MySQL</text>
  </g>

  <!-- Node.js / Web -->
  <g transform="translate(300, 230)">
    <rect width="68" height="28" rx="14" fill="#1E293B" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="34" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">⚡ Node.js</text>
  </g>

  <!-- HTML / Web -->
  <g transform="translate(32, 230)">
    <rect width="64" height="28" rx="14" fill="#1E293B" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="32" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">🌐 HTML</text>
  </g>
</svg>
